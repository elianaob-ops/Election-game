services:
  - type: web
    name: mandate-game
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: COMMUNITY_ADMIN_USER
        sync: false
      - key: COMMUNITY_ADMIN_PASSWORD
        sync: false
      - key: DB_PATH
        value: /data/game.sqlite
    disk:
      name: mandate-data
      mountPath: /data
      sizeGB: 1
