<!doctype html><html lang="he" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>בול בקלפי — משחק המנדטים</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800;900&display=swap');
:root{font-family:Heebo,Arial,sans-serif;color:#172b29;background:#f4f5ef}*{box-sizing:border-box}body{margin:0}header{border-bottom:1px solid #dce2d8;padding:22px max(6vw,20px);display:flex;justify-content:space-between;align-items:center}.brand{font-size:23px;font-weight:900}.brand b{background:#d8f270;padding:1px 8px;border-radius:7px;margin-left:10px}.pill{font-size:13px;border:1px solid #cdd6c9;border-radius:30px;padding:6px 13px}main{max-width:1100px;margin:auto;padding:55px 24px}h1{font-size:clamp(38px,6vw,68px);line-height:1.12;letter-spacing:-2px;margin:17px 0 20px;max-width:730px}p{line-height:1.8;color:#60716b}.eyebrow{font-size:13px;letter-spacing:1px;color:#61784b;font-weight:700}.hero{display:grid;grid-template-columns:1.5fr 1fr;gap:40px;align-items:center;margin-bottom:40px}.art{background:#173f36;border-radius:25px;height:250px;padding:26px;color:#e0f38c;display:flex;align-items:end;gap:11px;position:relative;overflow:hidden}.art span{background:#d8ef82;border-radius:8px 8px 0 0;flex:1}.art strong{position:absolute;top:15px;right:25px;font-size:64px;letter-spacing:-3px}.art small{position:absolute;top:40px;left:22px;font-size:14px;max-width:80px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:25px;align-items:start}.card{background:white;border:1px solid #e0e5dc;border-radius:18px;padding:27px;margin-bottom:20px}h2{font-size:22px;margin:0 0 18px}label{display:block;font-size:14px;font-weight:600;margin:15px 0 7px}input,textarea{font:inherit;border:1px solid #ccd6ce;border-radius:9px;padding:11px;width:100%;background:#fcfdf9;color:#173f36}textarea{min-height:190px;resize:vertical}button,.button{font:inherit;font-weight:700;cursor:pointer;border:0;border-radius:9px;padding:12px 21px;background:#d8f270;color:#173f36;display:inline-block;text-decoration:none}button:hover{filter:brightness(.96)}button:disabled{opacity:.5;cursor:default}.primary{width:100%;margin-top:23px}.secondary{background:#eef2e9}.row{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:13px 0;border-bottom:1px solid #edf0e9}.row input{width:85px;text-align:center;font-size:19px;font-weight:700}.dot{width:10px;height:10px;background:#8da98d;border-radius:50%;display:inline-block;margin-left:10px}.total{display:flex;justify-content:space-between;background:#f0f5e7;border-radius:10px;padding:14px;margin-top:20px;font-weight:700}.error{color:#ae3e2a}.notice{padding:14px;border-radius:10px;background:#f0f5e7;line-height:1.8;overflow-wrap:anywhere;margin:14px 0}.muted{font-size:13px;color:#6c7d72}ol{padding-right:20px;line-height:2.4;font-size:14px;color:#5b6d63}footer{text-align:center;color:#6b7b71;padding:25px;font-size:12px}.links input{direction:ltr;margin-bottom:6px}.tabs{display:flex;gap:8px;margin-bottom:20px}.tabs button{background:transparent}.tabs button.active{background:#173f36;color:white}.metric{font-size:38px;font-weight:800;margin:0;color:#173f36}#message{max-width:1052px;margin:12px auto;padding:0 20px}a{color:#315b36} .badge{font-size:12px;border-radius:20px;padding:5px 9px;background:#eff4e5}.result-number{font-size:20px;font-weight:800}.empty{padding:25px 0;text-align:center;color:#77867b}@media(max-width:740px){main{padding-top:30px}.hero{grid-template-columns:1fr;gap:15px}.art{height:160px}.art strong{font-size:48px}.layout{grid-template-columns:1fr}header{padding:18px}.card{padding:20px}h1{letter-spacing:-1px}.hero p{margin-bottom:0}}
.character-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}.character{margin:0;overflow:hidden;border:1px solid #dddccf;background:#fffaf0;border-radius:20px}.portrait{aspect-ratio:1;background-size:200% 300%;background-repeat:no-repeat}.character figcaption{text-align:center;font-size:18px;font-weight:800;padding:15px;border-top:1px solid #e9e4d6}.character-grid+.muted{margin-top:25px}.navlink{font-size:14px;margin-right:18px;text-decoration:none} @media(max-width:740px){.character-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.character figcaption{font-size:15px;padding:12px}.navlink{display:block;margin-right:0;font-size:12px}}
</style>
<header><div class="brand"><b>✓</b>בול בקלפי<a class="navlink" href="/characters">הכירו את החבורה ↗</a></div><div class="pill">120 מנדטים. ניחוש אחד.</div></header><div id="message" role="status" aria-live="polite"></div><main id="app"></main><footer>משחק ניחושים חברתי • נקודות בלבד, ללא כסף • ללא שיוך פוליטי</footer>
<script>
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function tell(s,bad=false){$('#message').textContent=s;$('#message').className=bad?'error':'notice';}
async function api(path,body){const r=await fetch('/api/'+path,{method:body?'POST':'GET',headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined});const data=await r.json();if(!r.ok)throw Error(data.error||'שגיאה בתקשורת');return data;}
function hero(title,subtitle){return `<section class="hero"><div><div class="eyebrow">משחק הבחירות של החבר׳ה</div><h1>${esc(title)}</h1><p>${esc(subtitle)}</p></div><div class="art" aria-hidden="true"><strong>120</strong><small>כל מנדט<br>משנה את המשחק.</small>${[35,56,42,75,96,65,47].map(h=>`<span style="height:${h}%"></span>`).join('')}</div></section>`;}
const colors=['#315b4f','#8aa344','#c7ae5c','#759eae','#ae8392','#b0b998'];
let game,tab='guess',seats=[],secret=new URLSearchParams(location.hash.slice(1)).get('admin');
const id=new URLSearchParams(location.search).get('game');
function home(){app.innerHTML=hero('מי יפגע בול\nב־120?','פותחים תחרות, שולחים לחברים ומגלים מי באמת מבין את המפה הפוליטית.')+`<div class="layout"><section class="card"><h2>פותחים קלפי חדשה</h2><p class="muted">מגדירים פעם אחת, וכל החברים מצטרפים דרך לינק.</p><form id="create"><label for="title">שם התחרות</label><input id="title" maxlength="100" required placeholder="למשל: הקלפי של החבר׳ה"><label for="deadline">מתי נועלים את הניחושים?</label><input id="deadline" type="datetime-local" required><label for="parties">המפלגות בתחרות — מפלגה אחת בכל שורה</label><textarea id="parties" required placeholder="הזינו את רשימת המפלגות לבחירות שלכם"></textarea><p class="muted">הרשימה נקבעת ביצירת התחרות. כדאי לוודא שכל המפלגות מופיעות.</p><button class="primary">יצירת תחרות וקישור שיתוף ←</button></form></section><aside><section class="card"><span class="badge">איך משחקים?</span><ol><li>מזינים ניחוש לכל מפלגה</li><li>מחלקים בדיוק 120 מנדטים</li><li>ממתינים לתוצאות</li><li>מגלים מי הכי קרוב</li></ol></section><section class="card"><h2>כל מנדט קובע</h2><p class="muted">מתחילים מ־120 נקודות. על כל מנדט שצריך להעביר בין מפלגות כדי להגיע לתוצאה, יורדת נקודה אחת. ניחוש מושלם = 120.</p></section></aside></div>`;
 const d=new Date(Date.now()+7*864e5);d.setMinutes(d.getMinutes()-d.getTimezoneOffset());$('#deadline').value=d.toISOString().slice(0,16);
 $('#create').onsubmit=async e=>{e.preventDefault();const b=e.submitter;b.disabled=true;try{const g=await api('games',{title:$('#title').value,parties:$('#parties').value.split('\n').map(x=>x.trim()).filter(Boolean),deadline:new Date($('#deadline').value).toISOString()});location.href='?game='+g.id+'#admin='+g.secret;}catch(e){tell(e.message,true);b.disabled=false;}};
}
function stored(){try{return JSON.parse(localStorage.getItem('guess-'+id)||'null');}catch{return null;}}
function save(v){try{localStorage.setItem('guess-'+id,JSON.stringify(v));}catch{tell('הניחוש נשמר בשרת, אך לא ניתן לשמור זיהוי בדפדפן הזה.');}}
function render(){const locked=Date.now()>=game.deadline||!!game.results;const mine=stored();
 app.innerHTML=hero(game.title,'הניחוש שלכם, המפה שלכם. חלקו את המנדטים והצטרפו לתחרות.')+`<div class="layout"><div>${secret?`<section class="card links"><h2>הקלפי מוכנה. מזמינים את החבר׳ה.</h2><label for="share">קישור להשתתפות</label><input id="share" readonly value="${esc(location.origin+location.pathname+'?game='+id)}"><button id="copy" class="secondary">העתקת קישור</button><label for="adminlink">קישור ניהול פרטי — שמרו אצלכם</label><input id="adminlink" readonly value="${esc(location.href)}"><p class="muted">מי שמחזיק בקישור הניהול יכול לפרסם ולתקן את התוצאות. אל תשתפו אותו עם המשתתפים.</p></section>`:''}<div class="tabs"><button data-tab="guess" class="${tab==='guess'?'active':''}">הניחוש שלי</button><button data-tab="board" class="${tab==='board'?'active':''}">טבלת דירוג</button>${secret?`<button data-tab="admin" class="${tab==='admin'?'active':''}">תוצאות</button>`:''}</div><section class="card" id="panel"></section></div><aside><section class="card"><span class="badge">${locked?'הניחושים נעולים':'הקלפי פתוחה'}</span><p class="metric">${game.count}</p><span class="muted">משתתפים כבר בפנים</span><hr style="border:0;border-top:1px solid #edf0e9;margin:20px 0"><strong>מועד נעילה</strong><p class="muted">${esc(new Date(game.deadline).toLocaleString('he-IL'))}</p></section><section class="card"><h2>איך מנצחים?</h2><p class="muted">120 פחות מחצית סכום ההפרשים המוחלטים בין הניחוש לתוצאה. יותר נקודות = קרוב יותר. תיקו נשאר תיקו.</p><p class="muted">אפשר לעדכן את הניחוש מאותו דפדפן עד הנעילה. שמות המשתתפים מוצגים בתחרות; הניחושים נשארים מוסתרים.</p></section></aside></div>`;
 document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render();});if($('#copy'))$('#copy').onclick=async()=>{try{await navigator.clipboard.writeText($('#share').value);tell('הקישור הועתק');}catch{$('#share').select();tell('סמנו והעתיקו את הקישור');}};
 const panel=$('#panel');
 if(tab==='board'){panel.innerHTML=`<h2>${game.results?'התוצאות על הלוח 🏆':'מי כבר הצטרף?'}</h2><p class="muted">${game.results?'הדירוג מחושב לפי התוצאות שהזין מנהל התחרות.':'הדירוג יופיע לאחר פרסום התוצאות. אין עדיין ניקוד.'}</p>`+(game.count?game.leaderboard.map((r,i)=>`<div class="row"><span>${game.results?esc(game.leaderboard.findIndex(x=>x.score===r.score)+1)+'. ':''}${esc(r.name)}</span><strong>${r.score===null?'ממתין לתוצאות':r.score+' נק׳'}</strong></div>`).join(''):'<div class="empty">היו הראשונים להצטרף לקלפי</div>');return;}
 const admin=tab==='admin';const values=admin?(game.results||game.parties.map(()=>0)):(seats.length?seats:mine?.seats||game.parties.map(()=>0));
 panel.innerHTML=`<h2>${admin?'הזנת תוצאות הבחירות':locked?'הניחושים ננעלו':mine?'הניחוש שלכם נשמר ✓':'איך תיראה הכנסת הבאה?'}</h2>${admin?'<p class="muted">הזינו תוצאות סופיות בלבד. פרסום אפשרי לאחר הנעילה, וניתן לתקן אחר כך.</p>':''}<form id="guess">${!admin?`<label for="name">השם שיופיע בתחרות</label><input id="name" maxlength="40" required ${locked?'disabled':''} value="${esc(mine?.name||'')}" placeholder="איך קוראים לכם?"><p class="muted">אין צורך בהרשמה. ההשתתפות אינה מאמתת זהות.</p>`:''}${game.parties.map((p,i)=>`<label class="row" for="seat-${i}"><span><i class="dot" style="background:${colors[i%colors.length]}"></i>${esc(p)}</span><input id="seat-${i}" type="number" min="0" max="120" step="1" required value="${values[i]}" ${!admin&&locked?'disabled':''} aria-label="מנדטים עבור ${esc(p)}"></label>`).join('')}<div class="total"><span>סך המנדטים</span><span id="sum"></span></div><p id="hint" class="muted" aria-live="polite"></p>${!admin&&locked?'':`<button id="submit" class="primary">${admin?'פרסום תוצאות וחישוב דירוג':'שמירת הניחוש שלי ←'}</button>`}</form>`;
 const inputs=[...panel.querySelectorAll('input[type=number]')];const update=()=>{const a=inputs.map(i=>Number(i.value)),sum=a.reduce((a,b)=>a+b,0);$('#sum').textContent=sum+' / 120';const valid=inputs.every(i=>i.value!==''&&i.checkValidity())&&sum===120;$('#hint').textContent=sum<120?'נשארו עוד '+(120-sum)+' מנדטים לחלוקה':sum>120?'צריך להוריד '+(sum-120)+' מנדטים':'כל 120 המנדטים חולקו ✓';if($('#submit'))$('#submit').disabled=!valid||(admin&&Date.now()<game.deadline);if(!admin)seats=a;};inputs.forEach(i=>i.oninput=update);update();
 $('#guess').onsubmit=async e=>{e.preventDefault();$('#submit').disabled=true;const a=inputs.map(i=>Number(i.value));try{if(admin){await api('games/'+id+'/results',{secret,seats:a});tell('התוצאות פורסמו והדירוג עודכן');tab='board';}else{const name=$('#name').value;const r=await api('games/'+id+'/guess',{name,seats:a,token:mine?.token});save({name,seats:a,token:r.token});tell('הניחוש נשמר! אפשר לעדכן מאותו דפדפן עד הנעילה.');}game=await api('games/'+id);render();}catch(e){tell(e.message,true);update();}};
}
function gallery(){
 const roster=[{"name": "גדי אייזנקוט", "image": "characters-1.png", "x": 0, "y": 0, "size": "200% 300%"}, {"name": "בנימין נתניהו", "image": "characters-1.png", "x": 100, "y": 0, "size": "200% 300%"}, {"name": "יאיר לפיד ונפתלי בנט", "image": "character-pairs.png", "x": 0, "y": 0, "size": "200% 200%"}, {"name": "יאיר גולן", "image": "characters-1.png", "x": 0, "y": 100, "size": "200% 300%"}, {"name": "אביגדור ליברמן", "image": "characters-1.png", "x": 100, "y": 100, "size": "200% 300%"}, {"name": "איתמר בן גביר", "image": "characters-2.png", "x": 0, "y": 0, "size": "200% 300%"}, {"name": "יצחק גולדקנופף", "image": "characters-2.png", "x": 100, "y": 0, "size": "200% 300%"}, {"name": "אריה דרעי", "image": "characters-2.png", "x": 0, "y": 50, "size": "200% 300%"}, {"name": "בצלאל סמוטריץ׳ ומשה פייגלין", "image": "character-pairs.png", "x": 100, "y": 0, "size": "200% 200%"}, {"name": "מנסור עבאס", "image": "characters-2.png", "x": 100, "y": 100, "size": "200% 300%"}, {"name": "יואב סגלוביץ׳", "image": "characters-3.png", "x": 0, "y": 0, "size": "200% 300%"}, {"name": "אחמד טיבי ואיימן עודה", "image": "character-pairs.png", "x": 100, "y": 100, "size": "200% 200%"}, {"name": "עופר וינטר", "image": "characters-3.png", "x": 100, "y": 50, "size": "200% 300%"}, {"name": "יועז הנדל וירון זליכה", "image": "character-pairs.png", "x": 0, "y": 100, "size": "200% 200%"}];
 app.innerHTML=hero('קטנים בחליפה.\nגדולים במנדטים.','18 דמויות, ארבעה צמדים — הגנגסטרים התינוקות של הקלפי.')+'<p><a class="button secondary" href="/">חזרה למשחק ←</a></p><div class="character-grid">'+roster.map(c=>'<figure class="character"><div class="portrait" role="img" aria-label="'+esc('קריקטורה של '+c.name)+'" style="background-image:url(/assets/'+c.image+');background-size:'+c.size+';background-position:'+c.x+'% '+c.y+'%"></div><figcaption>'+esc(c.name)+'</figcaption></figure>').join('')+'</div><p class="muted">איורים סאטיריים שנוצרו באמצעות AI. שיוך הדמויות כאן הוא בהתאם לבחירת יוצרי המשחק; רשימת המפלגות והמנדטים מוגדרת בנפרד ביצירת התחרות.</p>';
}
async function init(){if(location.pathname==='/characters')return gallery();if(!id)return home();app.innerHTML='<p>פותחים את הקלפי…</p>';try{game=await api('games/'+id);render();setInterval(async()=>{try{game=await api('games/'+id);if(tab==='board')render();else if(tab!=='admin'&&Date.now()>=game.deadline){const b=$('#submit');if(b)b.disabled=true;}}catch{}},15000);}catch(e){app.innerHTML='<section class="card"><h2>לא הצלחנו לפתוח את התחרות</h2><p>'+esc(e.message)+'</p><a href="/">יצירת תחרות חדשה</a></section>';}}
init();
</script></html>
